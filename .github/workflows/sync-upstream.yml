name: Sync upstream and validate

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync, test, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          git remote add upstream https://github.com/shuaiplus/nodewarden.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: npm ci

      - name: Validate and build
        if: steps.merge.outputs.changed == 'true'
        run: |
          npm run i18n:validate
          npm run test:config-compatibility
          npm run test:web-crypto
          npm run test:webauthn-connectors
          npm run build

      - name: Push validated update
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
